<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Background Circle Glow -->
  <circle cx="256" cy="256" r="180" fill="#0284c7" opacity="0.15" />
  <!-- Water Drop -->
  <path d="M256 96 C256 96 144 240 144 336 A112 112 0 0 0 368 336 C368 240 256 96 256 96 Z" fill="url(#waterGrad)" filter="url(#shadow)" />
  <!-- Gloss / Highlight -->
  <path d="M220 200 C200 240 190 280 190 320 C190 340 196 360 206 376 C194 366 186 352 186 336 C186 260 236 170 244 150 C240 166 230 182 220 200 Z" fill="url(#highlightGrad)" opacity="0.65" />
  <!-- Ripple Wave Accent -->
  <path d="M190 360 Q 256 390 322 360" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
